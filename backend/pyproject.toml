[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Parse_Video"
dynamic = ["version"]
authors = [
    {name = "Zhitao Xiang"}
]
description = "Parse Clone Video"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "fastapi==0.139.0",
    "uvicorn==0.51.0",
    "sqlalchemy==2.0.23",
    "alembic==1.13.0",
    "psycopg2-binary==2.9.9",
    "celery==5.3.6",
    "redis==8.0.1",
    "python-multipart==0.0.6",
    "httpx==0.25.2",
    "pydantic[email]>=2.7.0,<3.0",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.0",
    "yt-dlp==2023.12.30",
    "langchain==1.3.4",
    "langchain-protocol==0.0.16",
    "langchain_openai==1.2.2",
    "langchain_core==1.4.0",
    "scenedetect==0.7",
    "pandas==3.0.3",
    "tabulate==0.10.0",
    "volcengine-python-sdk>=5.0.34",
    "mutagen==1.47.0",
    "pydub==0.25.1",
    "joblib==1.5.3",
    "scikit-learn==1.9.0",
    "videofetch==0.9.1",
    "pillow==12.3.0",
    "asyncpg==0.31.0",
    "pwdlib[argon2,bcrypt]==0.3.0",
    "PyJWT==2.13.0",
    "func_timeout==4.3.5",
    "slowapi==0.1.10"
]


[project.scripts]
start-api = "app.main:main"
start-worker = "app.celery_app:start_celery_worker"
train-tts = "app.services.predict.predict_voice_duration:train_tts_predict_model"
init-db = "app.prestart.prestart:main"
create-admin = "app.prestart.create_admin:main"

[tool.setuptools]
packages = { find = { include = ["app", "app.*"] } }