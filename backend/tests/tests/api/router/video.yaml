- name: 获取已经上传的视频信息
  steps:
    - request:
        method: GET
        url: 'api/v1/videos'
        params:
          skip: 0
          limit: 20
    - response:
        status_code: 200
        json:
          "":
            type: list
            len_gt: 0
            each:
              id:
                type: int
                ge: 0
              filename:
                type: str
                not_empty: true
              status:
                type: str
                in: 
                  - pending
                  - processing
                  - done
                  - failed
              progress:
                type: int
                ge: 0
                le: 100
              
              error_message:
                any: true

- name: 获取指定video信息
  steps:
    - request:
        method: GET
        url: 'api/v1/videos/${video_id}/status'
    - response:
        status_code: 200
        json:
          id:
            type: int
            ge: 0
          filename:
            type: str
            not_empty: true
          status:
            type: str
            in: 
              - pending
              - processing
              - done
              - failed
          progress:
            type: int
            ge: 0
            le: 100
          
          error_message:
            any: true

