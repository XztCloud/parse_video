---
- name: 上传视频
  steps:
    - request:
        method: POST
        url: 'api/v1/videos/upload'
        files:
          file: !func gen_fake_file
    - response:
        status_code: 200
        json:
          id: 
            type: int
            gt: 0
          filename: 
            type: str
            not_empty: true
          status:
            eq: pending
          progress:
            eq: 0
    - extract:
        video_id: [json, $.id]

- name: 上传视频触发限流
  steps:
    - request:
        method: POST
        url: 'api/v1/videos/upload'
        files:
          file: !func gen_fake_file
    - response:
        status_code: 429

