# parse_video 反向代理片段：把请求转给前端容器（Next.js，容器内监听 3000）
#
# 由 parse_video.conf.template 里的 server 块 include。
# 依赖同文件中 http 层的 map（$connection_upgrade），不要单独 include。

proxy_pass http://127.0.0.1:3000;
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

# 视频上传：后端限制 200MB / 3 分钟，nginx 默认只允许 1MB
# 不放开的话上传会直接 413（前端表现是"点了上传没反应/报错"）
client_max_body_size 500m;
client_body_timeout  300s;
proxy_request_buffering off;
proxy_read_timeout   300s;
proxy_send_timeout   300s;
