version: "3.8"

services:
  prestart:
    build: ./backend
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - RUN_ENV=DEV
    command: bash prestart.sh

  backend:
    build: ./backend
    env_file:
      - ./.env
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/LOGS:/app/LOGS
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - RUN_ENV=PRODUCTION
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      redis:
        condition: service_started
      prestart:
        condition: service_completed_successfully

  celery_worker:
    build: ./backend  # 使用跟上面完全相同的构建上下文和镜像
    env_file:
      - .env
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/LOGS:/app/LOGS
    # 用 command 覆盖 Dockerfile 的默认 CMD，改走 Celery 启动命令
    command: start-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      prestart:
        condition: service_completed_successfully
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - RUN_ENV=PRODUCTION
    

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - API_PROXY_TARGET=http://backend:8000
    env_file:
      - .env
    ports:
      - "80:3000"
    environment:
      - API_PROXY_TARGET=http://backend:8000

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parse_video"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  postgres_data: